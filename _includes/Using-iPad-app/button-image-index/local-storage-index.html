<div id="local-store1-container" class="container5">
    <img src="../fig/Using-iPad-app/local-store1.png" alt="local-store1">
    <button class="file-button" style="top: 29.5%; left: 17%;" onclick="showInfo('user-pref')"></button>
    <button class="file-button" style="top: 43%; left: 17%;" onclick="showInfo('local-db')"></button>
    <button class="file-button" style="top: 58%; left: 17%;" onclick="newImg('local-store1-container', 'local-store2-container')"></button>
</div>

<div id="local-store2-container" class="container5" style="display: none;">
    <img src="../fig/Using-iPad-app/local-store2.png" alt="local-store2">
    <button class="file-button" style="top: 31%; left: 17%;" onclick="showInfo('typelist')"></button>
    <button class="file-button" style="top: 52%; left: 17%;" onclick="showInfo('ship-image')"></button>
    <button class="file-button" style="top: 72%; left: 17%;" onclick="showInfo('qr-image')"></button>
</div>

<div id="user-pref" class="popup">
    <span class="close" onclick="closePopup('user-pref')">&times;</span>
    <p>Individual user information is stored here, except for sensitive data like passwords.</p>
</div>

<div id="local-db" class="popup">
    <span class="close" onclick="closePopup('local-db')">&times;</span>
    <p>Local Database is stored here.</p>
</div>
<div id="typelist" class="popup">
    <span class="close" onclick="closePopup('typelist')">&times;</span>
    <p>Where Type List information is stored.</p>
</div>

<div id="ship-image" class="popup">
    <span class="close" onclick="closePopup('ship-image')">&times;</span>
    <p>Where images captured throught the app are stored</p>
    <img src="../fig/Using-iPad-app/ship-image.png" alt="ship-image" style="max-width: 100%">
</div>

<div id="qr-image" class="popup">
    <span class="close" onclick="closePopup('qr-image')">&times;</span>
    <p>Where QR-codes generated by the app are stored.</p>
    <img src="../fig/Using-iPad-app/qr-image.png" alt="qr-image" style="max-width: 100%">
</div>



<style>
    body {
        font-family: Arial, sans-serif;
    }

    .container5 {
        position: relative;
        display: inline-block;

    }

    .container5 img {
        display: block;
        width: 70%;
        height: auto;
    }

    .file-button {
        position: absolute;
        background: rgba(0, 0, 0, 0); 
        border: 2px solid red; 
        cursor: pointer;
        width: 210px; 
        height: 50px; 
        outline: none;
    }


    .popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
        background-color: white;
        border: 1px solid #ccc;
        z-index: 1000;
        max-height: 70vh;
        overflow-y: auto; 
    }

    .popup .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        cursor: pointer;
    }

    </style>

<script>

function newImg(currentContainerId, nextContainerId) {
        document.getElementById(currentContainerId).style.display = 'none';
        document.getElementById(nextContainerId).style.display = 'block';
    }

    function showInfo(infoId) {
        document.getElementById(infoId).style.display = 'block';
    }

    function closePopup(infoId) {
        document.getElementById(infoId).style.display = 'none';
    }
</script>
