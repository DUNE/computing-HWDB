<div id="pid-add-container" class="container4">
    <img src="../fig/Using-iPad-app/pid-add.png" alt="pid-add">
    <button class="rectangle-m-button2" style="top: 81%; left: 38%;" onclick="showInfo('new-pid')"></button>
    <button class="large-button2" style="top: 52%; left: 27%;" onclick="showInfo('subcomp-assign')"></button>
</div>



<div id="subcomp-assign" class="popup">
    <span class="close" onclick="closePopup('subcomp-assign')">&times;</span>
    <p>The app looks up the corresponding Component Type definition. If any sub-component Type is defined,it will list it here. One can assign sub-component PIDs through “PID Display” session easily.</p>
</div>

<div id="new-pid" class="popup">
    <span class="close" onclick="closePopup('new-pid')">&times;</span>
    <p>Once a new PID is generated by the HWDB, the generated PID is displayed here.</p>
</div>



<style>
    body {
        font-family: Arial, sans-serif;
    }

    .container4 {
        position: relative;
        display: inline-block;

    }

    .container4 img {
        display: block;
        width: 50%;
        height: auto;
    }

    .large-button2 {
        position: absolute;
        background: rgba(0, 0, 0, 0); 
        border: 2px solid red; 
        cursor: pointer;
        width: 525px; 
        height: 75px; 
        outline: none;
    }


    .rectangle-m-button2 {
        position: absolute;
        background: rgba(0, 0, 0, 0); 
        border: 2px solid red; 
        cursor: pointer;
        width: 270px; 
        height: 50px; 
        outline: none;
    }

    .popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
        background-color: white;
        border: 1px solid #ccc;
        z-index: 1000;
        max-height: 70vh;
        overflow-y: auto; 
    }

    .popup .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        cursor: pointer;
    }

    </style>

<script>

    function showInfo(infoId) {
        document.getElementById(infoId).style.display = 'block';
    }

    function closePopup(infoId) {
        document.getElementById(infoId).style.display = 'none';
    }
</script>
